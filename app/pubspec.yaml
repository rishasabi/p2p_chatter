name: app
description: "Offline Peer-to-Peer Mesh Communication App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State Management ---
  flutter_riverpod: ^2.5.1

  # --- Local Storage ---
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- QR Code Operations ---
  qr_flutter: ^4.1.0          
  mobile_scanner: ^5.1.1       

  # --- Permissions ---
  permission_handler: ^11.3.1  

  # --- Native Bridge & Helpers ---
  uuid: ^4.4.0                 
  intl: ^0.19.0                
  ffi: ^2.1.3
  flutter_blue_plus: ^1.34.5

  # --- HTTP Client for Go backend ---
  http: ^1.2.1
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  url_launcher: ^6.3.3
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Unbounded.txt
    - assets/fonts/OFL-Figtree.txt

  # Both under the SIL Open Font License (see assets/fonts/OFL-*.txt). Bundled
  # rather than fetched: Chatter has to work with no internet at all.
  fonts:
    # Display: wordmark, titles, headings and buttons
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
    # Text: messages and everything else
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Italic.ttf
          style: italic
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700